apiVersion: kaptain.org/1.37
kind: kubernetes-run-platform-meta-environment
spec:
  global:
    projectName:
      stripRepositoryNamePrefix: test
  contents:
    - run-env-deployment-keel-all-in-one:[1.0.4,2.0)
  main:
    environment:
      deployMode: deployment
      imageAutoUpdateProvider: keelson
      generateIdealEnvironmentDeployManifests: true
      checksumSecretsTiming: build
      failOnUnreferencedConfigOrSecrets: true
      # The namespace-oversight matrix. Every posture and every override
      # direction appears here exactly once.
      cleanUp:
        policy: dryrun
        additionalResources:
          - kind: ClusterRole
            name: 'envoy-gateway-*'
          - kind: ValidatingWebhookConfiguration
            name: cert-manager-webhook
        accumulatingResources:
          jobs:
            type: count
            count: 10
          configmaps:
            type: age
            age: 30d
          secrets:
            type: all

        # Namespaces nobody listed at all: reported, never touched.
        undeclaredNamespacePolicy: dryrun

        additionalNamespaces:
          defaultPolicy: dryrun
          namespaces:
            # Allow-list posture, empty: the namespace must be strictly
            # empty, spelled out rather than implied.
            - name: default
              allowedResources: []

            # Allow-list posture, populated: whitelist of well-known infra,
            # exercising exact name, label selector and glob together.
            - name: kube-system
              allowedResources:
                - kind: Service
                  name: kube-dns
                - kind: Deployment
                  labelSelector:
                    matchLabels:
                      k8s-app: kube-dns
                - kind: ConfigMap
                  name: 'coredns*'

            # Per-entry override pushing FORWARD to enabled while the block
            # default stays dryrun.
            - name: kube-public
              policy: enabled
              allowedResources:
                - kind: ConfigMap
                  name: cluster-info

            # Deny-list posture, populated: everything tolerated except the
            # things named here.
            - name: monitoring
              deniedResources:
                - kind: Job
                  name: 'legacy-migration-*'
                - kind: Pod
                  labelSelector:
                    matchLabels:
                      kaptain.org/quarantine: "true"

            # Deny-list posture, empty: watch this namespace and protect the
            # namespace object, but police nothing inside it.
            - name: kube-node-lease
              deniedResources: []
    hooks:
      preBuild: test-hooks/pre-build.bash
      preTaggingTests: test-hooks/pre-tagging-tests.bash
      postVersionsAndNaming: test-hooks/post-versions-and-naming.bash
      preDockerPrepare: test-hooks/pre-docker-prepare.bash
      postDockerTests: test-hooks/post-docker-tests.bash
      prePackagePrepare: test-hooks/pre-package-prepare.bash
      postPackageTests: test-hooks/post-package-tests.bash
      postBuild: test-hooks/post-build.bash
